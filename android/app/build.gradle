plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saeedsh.islandlink'
    compileSdk 35

    defaultConfig {
        applicationId "com.saeedsh.islandlink"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so "Build APK" gives an installable file right away.
            // Replace with your own signing config before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
