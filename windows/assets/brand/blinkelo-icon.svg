<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#20223a"/>
      <stop offset="0.55" stop-color="#121320"/>
      <stop offset="1" stop-color="#0a0a10"/>
    </linearGradient>
    <radialGradient id="gL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3fb6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b65cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b65cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4f8ff"/>
      <stop offset="0.45" stop-color="#47a6ff"/>
      <stop offset="1" stop-color="#9a5cff"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd8ff"/>
      <stop offset="1" stop-color="#a874ff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="tileClip"><rect x="20" y="20" width="472" height="472" rx="108"/></clipPath>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <ellipse cx="170" cy="262" rx="190" ry="120" fill="url(#gL)"/>
    <ellipse cx="350" cy="250" rx="190" ry="120" fill="url(#gR)"/>
  </g>
  <rect x="20.5" y="20.5" width="471" height="471" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- the island -->
  <rect x="78" y="176" width="356" height="160" rx="80" fill="#000" stroke="url(#rim)" stroke-width="4"/>
  <!-- glow under the eyes -->
  <g filter="url(#blur18)" opacity="0.9">
    <rect x="186" y="206" width="48" height="100" rx="24" fill="#3d9bff"/>
    <path d="M276 270 Q306 232 336 270" fill="none" stroke="#9a5cff" stroke-width="26" stroke-linecap="round"/>
  </g>
  <!-- left eye (open) -->
  <rect x="186" y="206" width="48" height="100" rx="24" fill="url(#eye)"/>
  <ellipse cx="203" cy="226" rx="8" ry="6.5" fill="#fff" opacity="0.9"/>
  <!-- right eye (wink) -->
  <path d="M276 270 Q306 232 336 270" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round"/>
</svg>
